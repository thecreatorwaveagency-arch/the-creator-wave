<style>
:root{
  --ink:#05070D; --surface:#0E1422; --surface-2:#131B2D;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --blue:#0050F8; --blue-hover:#1A63FF; --deep:#0024B0;
  --foam:#AADCFA; --mist:#9AA4B8; --white:#FFFFFF; --danger:#FF8A8A;
  --radius:16px; --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-ar:'IBM Plex Sans Arabic','Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--ink);color:var(--white);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(0,80,248,.22),transparent 60%)}
html[dir=rtl] body{font-family:var(--font-ar)}
.ltr{direction:ltr;unicode-bidi:isolate;font-family:var(--font)}
a{color:inherit}
:focus-visible{outline:2px solid var(--foam);outline-offset:3px;border-radius:8px}
.wrap{max-width:440px;margin:0 auto;padding:20px 16px 32px}

/* language selector */
.lang{display:flex;gap:2px;width:max-content;margin-inline-start:auto;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{all:unset;cursor:pointer;font:600 12px/1 var(--font);letter-spacing:.06em;color:var(--mist);padding:8px 12px;border-radius:999px;min-width:20px;text-align:center}
.lang button[aria-pressed=true]{background:var(--blue);color:var(--white)}
.lang button:focus-visible{outline:2px solid var(--foam)}

/* hero */
.hero{text-align:center;margin-top:28px}
.mark{position:relative;width:132px;height:132px;margin:0 auto 18px}
.mark img{position:relative;width:100%;height:100%;display:block;z-index:1}
.wave{position:absolute;left:50%;top:50%;width:300px;height:80px;transform:translate(-50%,-50%);overflow:hidden;opacity:.45;z-index:0;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent);mask-image:linear-gradient(90deg,transparent,#000 25%,#000 75%,transparent)}
.wave svg{width:600px;height:80px;display:block;animation:drift 14s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-300px)}}
@media (prefers-reduced-motion:reduce){.wave svg{animation:none}.sheet{transition:none!important}}
.brand{font-weight:800;font-size:22px;letter-spacing:.16em;margin:0}
.tag{font-weight:600;font-size:16px;margin:8px 0 0}
.pos{color:var(--mist);font-size:14.5px;margin:10px auto 0;max-width:340px}

/* cta cards */
.ctas{margin-top:28px;display:grid;gap:12px}
.cta{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:84px;padding:16px 18px;border-radius:var(--radius);transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
.cta:active{transform:scale(.985)}
.cta .k{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;opacity:.8}
html[dir=rtl] .cta .k{letter-spacing:0;font-size:12px}
.cta .t{display:block;font-size:18px;font-weight:700;margin:3px 0 2px}
.cta .s{display:block;font-size:13.5px;opacity:.85}
.cta svg{flex:none;width:22px;height:22px}
html[dir=rtl] .cta svg{transform:scaleX(-1)}
.cta.primary{background:var(--blue);color:var(--white)}
.cta.primary:hover{background:var(--blue-hover)}
.cta.secondary{border:1px solid rgba(170,220,250,.45);color:var(--white)}
.cta.secondary:hover{border-color:var(--foam);background:rgba(170,220,250,.05)}
.cta.secondary .k,.cta.secondary svg{color:var(--foam)}
.cta.secondary .s{color:var(--mist);opacity:1}

/* services + contact */
.sec{margin-top:30px}
.label{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--mist);margin:0 0 6px}
html[dir=rtl] .label{letter-spacing:0;font-size:12.5px}
.services{font-size:14.5px;margin:0}
.contact{margin-top:30px;border-top:1px solid var(--line);padding-top:18px;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;color:var(--white);font-size:14.5px;padding:0 4px;border-radius:10px}
.row:hover{color:var(--foam)}
.row svg{width:18px;height:18px;color:var(--foam);flex:none}
footer{margin-top:28px;text-align:center;color:var(--mist);font-size:12.5px}
footer button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:6px;display:inline-block}

/* sheet (forms + privacy) */
.overlay{position:fixed;inset:0;background:rgba(2,4,9,.6);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s ease}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--ink);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (min-width:600px){.sheet{inset:24px auto 24px 50%;width:520px;margin-left:-260px;border:1px solid var(--line);border-radius:20px;overflow:hidden}}
.sheet header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--ink)}
.sheet header h2{margin:0;font-size:18px;font-weight:700}
.x{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--mist)}
.x:hover{background:var(--surface);color:var(--white)}
.x svg{width:20px;height:20px}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px 28px}
.intro{color:var(--mist);font-size:14.5px;margin:0 0 20px}

.f{margin-bottom:20px;border:0;padding:0;min-width:0}
.f > label, .f > legend{display:block;font-size:14px;font-weight:600;margin-bottom:8px;padding:0}
.opt{color:var(--mist);font-weight:500;font-size:12.5px;margin-inline-start:6px}
.hint{color:var(--mist);font-weight:500;font-size:12.5px;display:block;margin-top:2px}
input[type=text],input[type=email],textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;color:var(--white);font:inherit;font-size:16px;padding:12px 14px;min-height:48px;transition:border-color .15s}
textarea{min-height:104px;resize:vertical}
input::placeholder,textarea::placeholder{color:#5F6A80}
input:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,80,248,.25)}
.f.err input,.f.err textarea{border-color:var(--danger)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;width:1px;height:1px}
.chip span{display:inline-flex;align-items:center;min-height:42px;padding:8px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;cursor:pointer;unicode-bidi:plaintext;transition:all .12s}
.chip input:checked + span{background:var(--blue);border-color:var(--blue);color:var(--white)}
.chip input:focus-visible + span{outline:2px solid var(--foam);outline-offset:2px}
.f.err .chip span{border-color:rgba(255,138,138,.5)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{flex:none;width:22px;height:22px;margin:1px 0 0;accent-color:var(--blue)}
.check a,.linkbtn{all:unset;cursor:pointer;color:var(--foam);text-decoration:underline;text-underline-offset:3px}
.msg{color:var(--danger);font-size:13px;margin:6px 0 0;display:none}
.f.err .msg{display:block}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}
.submit{all:unset;box-sizing:border-box;cursor:pointer;width:100%;min-height:52px;border-radius:14px;background:var(--blue);color:var(--white);font-weight:700;font-size:16px;text-align:center;padding:14px;margin-top:6px}
.submit:hover{background:var(--blue-hover)}
.submit[aria-busy=true]{opacity:.7;cursor:progress}
.alert{background:rgba(255,138,138,.08);border:1px solid rgba(255,138,138,.35);color:#FFD1D1;border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0 0;display:none}
.alert.show{display:block}
.done{text-align:center;padding:48px 8px}
.done .ok{width:56px;height:56px;border-radius:50%;background:rgba(0,80,248,.18);display:grid;place-items:center;margin:0 auto 16px;color:var(--foam)}
.done p{font-size:16px;margin:0 0 24px}
.done .back{all:unset;cursor:pointer;border:1px solid var(--line-2);border-radius:12px;padding:12px 20px;min-height:20px;font-weight:600}
.privacy h3{font-size:15px;margin:20px 0 6px}
.privacy p{color:#C9D0DC;font-size:14.5px;margin:0 0 8px}
.privacy .meta{color:var(--mist);font-size:12.5px;margin-top:20px}
body.lock{overflow:hidden}
</style>

/* ---------------- State ---------------- */
let lang = "en";
let current = null;          // "brand" | "creator" | "privacy" | null
let returnTo = null;         // form to go back to after reading privacy
let lastFocus = null;
const built = {};            // cached form DOM per form
const sent = {};             // forms already submitted in this visit

const $ = (s, r=document) => r.querySelector(s);
const tr = k => T[lang][k];
const L = obj => obj[lang];
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  kids.forEach(k => k && n.append(k));
  return n;
};

/* ---------------- Language ---------------- */
function setLang(l){
  lang = T[l] ? l : "en";
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  document.querySelectorAll("[data-t]").forEach(n => n.textContent = tr(n.dataset.t));
  document.querySelectorAll("[data-t-aria]").forEach(n => n.setAttribute("aria-label", tr(n.dataset.tAria)));
  Object.keys(built).forEach(relabel);
  if (current) renderTitle();
  if (current === "privacy") renderPrivacy();
  try { localStorage.setItem("tcw-lang", lang); } catch(e){}
}

/* ---------------- Build forms ---------------- */
function buildForm(key){
  const cfg = FORMS[key];
  const form = el("form", {novalidate:"", "data-form":key});
  form.append(el("p", {class:"intro", "data-k":"intro"}));
  form.append(el("div", {class:"hp", "aria-hidden":"true"}, el("input", {type:"text", name:"hp", tabindex:"-1", autocomplete:"off"})));

  cfg.fields.forEach(f => {
    const id = key + "-" + f.id;
    const msg = el("p", {class:"msg", id:id+"-msg", "aria-live":"polite"});
    let wrap;
    if (f.type === "single" || f.type === "multi") {
      wrap = el("fieldset", {class:"f", "data-field":f.id, "aria-describedby":id+"-msg"});
      const lg = el("legend", {}, el("span", {"data-k":"label"}));
      if (!f.req) lg.append(el("span", {class:"opt", "data-k":"optional"}));
      if (f.type === "multi") lg.append(el("span", {class:"hint", "data-k":"many"}));
      wrap.append(lg);
      const chips = el("div", {class:"chips"});
      f.options.forEach((op, i) => {
        const inp = el("input", {type: f.type === "single" ? "radio" : "checkbox", name:f.id, value:op.v, id:id+"-"+i});
        chips.append(el("label", {class:"chip", for:id+"-"+i}, inp, el("span", {"data-opt":i})));
      });
      wrap.append(chips, msg);
    } else if (f.type === "consent" || f.type === "age") {
      wrap = el("div", {class:"f", "data-field":f.id});
      const inp = el("input", {type:"checkbox", name:f.id, id, value:"Yes", "aria-describedby":id+"-msg"});
      const txt = el("span", {"data-k": f.type === "age" ? "age" : "consent"});
      const lab = el("label", {class:"check", for:id}, inp, el("span", {}, txt));
      if (f.type === "consent") {
        const lk = el("button", {type:"button", class:"linkbtn", "data-k":"privacyLink"});
        lk.addEventListener("click", e => { e.preventDefault(); returnTo = key; open("privacy"); });
        lab.lastChild.append(" ", lk);
      }
      wrap.append(lab, msg);
    } else {
      wrap = el("div", {class:"f", "data-field":f.id});
      const lab = el("label", {for:id}, el("span", {"data-k":"label"}));
      if (!f.req) lab.append(el("span", {class:"opt", "data-k":"optional"}));
      const attrs = {id, name:f.id, "aria-describedby":id+"-msg", maxlength: f.type === "textarea" ? "1500" : "200"};
      if (f.auto) attrs.autocomplete = f.auto;
      if (f.ph) attrs.placeholder = f.ph;
      let inp;
      if (f.type === "textarea") inp = el("textarea", attrs);
      else {
        attrs.type = f.type === "email" ? "email" : "text";
        if (f.type === "link") { attrs.inputmode = "url"; attrs.autocapitalize = "off"; attrs.spellcheck = "false"; attrs.dir = "ltr"; }
        if (f.type === "email") { attrs.dir = "ltr"; attrs.autocapitalize = "off"; }
        if (f.ltr) { attrs.dir = "ltr"; attrs.autocapitalize = "off"; attrs.spellcheck = "false"; }
        inp = el("input", attrs);
      }
      wrap.append(lab, inp, msg);
    }
    wrap.dataset.idx = cfg.fields.indexOf(f);
    form.append(wrap);
  });

  form.append(el("div", {class:"alert", role:"alert"}));
  form.append(el("button", {type:"submit", class:"submit", "data-k":"submit"}));
  form.addEventListener("input", e => { const f = e.target.closest(".f"); if (f) f.classList.remove("err"); });
  form.addEventListener("change", e => { const f = e.target.closest(".f"); if (f) f.classList.remove("err"); });
  form.addEventListener("submit", e => { e.preventDefault(); submit(key, form); });
  built[key] = form;
  relabel(key);
  return form;
}

function relabel(key){
  const form = built[key], cfg = FORMS[key];
  form.querySelector('[data-k=intro]').textContent = L(cfg.intro);
  form.querySelector('[data-k=submit]').textContent = L(cfg.submit);
  form.querySelectorAll(".f").forEach(w => {
    const f = cfg.fields[+w.dataset.idx];
    w.querySelectorAll('[data-k=label]').forEach(n => n.textContent = L(f.label));
    w.querySelectorAll('[data-k=optional]').forEach(n => n.textContent = tr("optional"));
    w.querySelectorAll('[data-k=many]').forEach(n => n.textContent = tr("many"));
    w.querySelectorAll('[data-k=consent]').forEach(n => n.textContent = tr("consent"));
    w.querySelectorAll('[data-k=age]').forEach(n => n.textContent = tr("age"));
    w.querySelectorAll('[data-k=privacyLink]').forEach(n => n.textContent = tr("privacyLink"));
    w.querySelectorAll('[data-opt]').forEach(n => n.textContent = f.options[+n.dataset.opt][lang]);
    if (w.classList.contains("err")) showErr(w, w.dataset.err);
  });
  const done = form.parentNode && form.parentNode.querySelector(".done");
  if (done) fillDone(done, key);
}

/* ---------------- Validation and submit ---------------- */
const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
const isLink = v => /^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(v) || /^@[\w.]{2,}$/.test(v);
function showErr(w, code){ w.dataset.err = code; w.classList.add("err"); w.querySelector(".msg").textContent = tr(code); }

function validate(key, form){
  const cfg = FORMS[key]; let first = null;
  form.querySelectorAll(".f").forEach(w => {
    const f = cfg.fields[+w.dataset.idx]; let code = null;
    if (f.type === "single" || f.type === "multi") {
      if (f.req && !w.querySelector("input:checked")) code = "errChoice";
    } else if (f.type === "consent" || f.type === "age") {
      if (!w.querySelector("input").checked) code = f.type === "age" ? "errAge" : "errConsent";
    } else {
      const v = w.querySelector("input,textarea").value.trim();
      if (f.req && !v) code = "errRequired";
      else if (v && f.type === "email" && !isEmail(v)) code = "errEmail";
      else if (v && f.type === "link" && !isLink(v)) code = "errLink";
    }
    if (code) { showErr(w, code); first = first || w; } else w.classList.remove("err");
  });
  if (first) {
    first.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"center"});
    const focusable = first.querySelector("input,textarea"); if (focusable) focusable.focus({preventScroll:true});
  }
  return !first;
}

function collect(key, form){
  const cfg = FORMS[key], data = { form:key, lang, page:location.href.split("#")[0] };
  cfg.fields.forEach(f => {
    if (f.type === "multi") data[f.id] = [...form.querySelectorAll(`input[name="${f.id}"]:checked`)].map(i => i.value).join(", ");
    else if (f.type === "single") { const c = form.querySelector(`input[name="${f.id}"]:checked`); data[f.id] = c ? c.value : ""; }
    else if (f.type === "consent" || f.type === "age") data[f.id] = form.querySelector(`input[name="${f.id}"]`).checked ? "Yes" : "No";
    else {
      let v = form.querySelector(`[name="${f.id}"]`).value.trim();
      if (f.type === "link" && v && !/^https?:\/\//i.test(v) && !v.startsWith("@")) v = "https://" + v;
      data[f.id] = v;
    }
  });
  data.hp = form.querySelector('[name=hp]').value;
  return data;
}

function alertBox(form, key){
  const a = form.querySelector(".alert"); a.textContent = "";
  a.append(tr(key), el("a", {href:"mailto:"+CONTACT_EMAIL, class:"ltr", text:CONTACT_EMAIL}), ".");
  a.classList.add("show");
}

async function submit(key, form){
  const btn = form.querySelector(".submit"), a = form.querySelector(".alert");
  a.classList.remove("show");
  if (btn.getAttribute("aria-busy") === "true") return;
  if (!validate(key, form)) return;
  if (!SCRIPT_URL) { alertBox(form, "errNotConnected"); console.warn("The Creator Wave: SCRIPT_URL is empty. See the setup guide."); return; }
  btn.setAttribute("aria-busy","true"); btn.textContent = tr("sending");
  try {
    await fetch(SCRIPT_URL, { method:"POST", mode:"no-cors", body:new URLSearchParams(collect(key, form)) });
    sent[key] = true; showDone(key);
  } catch (err) {
    alertBox(form, "errNetwork");
  } finally {
    btn.removeAttribute("aria-busy"); btn.textContent = L(FORMS[key].submit);
  }
}

function fillDone(box, key){
  box.querySelector("p").textContent = L(FORMS[key].done);
  box.querySelector(".back").textContent = tr("back");
}
function showDone(key){
  const body = $("#sheetBody"); body.textContent = "";
  const box = el("div", {class:"done", role:"status"},
    el("div", {class:"ok", "aria-hidden":"true"}),
    el("p"), el("button", {type:"button", class:"back"}));
  box.firstChild.innerHTML = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';
  box.querySelector(".back").addEventListener("click", close);
  body.append(box); fillDone(box, key);
  built[key].reset();
  box.querySelector(".back").focus();
}

/* ---------------- Sheet (open / close) ---------------- */
function renderTitle(){
  $("#sheetTitle").textContent = current === "privacy" ? PRIVACY[lang].title : L(FORMS[current].title);
}
function renderPrivacy(){
  const body = $("#sheetBody"); body.textContent = "";
  const box = el("div", {class:"privacy"});
  PRIVACY[lang].body.forEach(([h, p]) => box.append(el("h3", {text:h}), el("p", {text:p})));
  box.append(el("p", {class:"meta", text:PRIVACY[lang].updated}));
  body.append(box);
}
function open(what){
  if (!current) lastFocus = document.activeElement;
  current = what;
  const body = $("#sheetBody"); body.textContent = ""; body.scrollTop = 0;
  if (what === "privacy") renderPrivacy();
  else { if (sent[what]) { showDone(what); } else body.append(built[what] || buildForm(what)); returnTo = null; }
  renderTitle();
  $("#overlay").classList.add("open"); $("#sheet").classList.add("open");
  document.body.classList.add("lock");
  if (location.hash !== "#" + what) history.replaceState(null, "", "#" + what);
  setTimeout(() => $("#closeBtn").focus(), 50);
}
function close(){
  if (current === "privacy" && returnTo) { const r = returnTo; returnTo = null; open(r); return; }
  current = null;
  $("#overlay").classList.remove("open"); $("#sheet").classList.remove("open");
  document.body.classList.remove("lock");
  history.replaceState(null, "", location.pathname + location.search);
  if (lastFocus) lastFocus.focus();
}

/* ---------------- Wiring ---------------- */
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => { returnTo = null; open(b.dataset.open); }));
$("#closeBtn").addEventListener("click", close);
$("#overlay").addEventListener("click", close);
document.addEventListener("keydown", e => {
  if (!current) return;
  if (e.key === "Escape") close();
  if (e.key === "Tab") {
    const items = [...$("#sheet").querySelectorAll('button,input:not([tabindex="-1"]),textarea,a[href]')].filter(n => n.offsetParent !== null);
    if (!items.length) return;
    const f = items[0], l = items[items.length-1];
    if (e.shiftKey && document.activeElement === f) { e.preventDefault(); l.focus(); }
    else if (!e.shiftKey && document.activeElement === l) { e.preventDefault(); f.focus(); }
  }
});

/* Start: ?lang=fr|ar in the URL, then the visitor's last choice, else English.
   #brand, #creator or #privacy in the URL opens that panel directly. */
(function init(){
  let start = "en";
  try { start = localStorage.getItem("tcw-lang") || "en"; } catch(e){}
  const q = new URLSearchParams(location.search).get("lang");
  if (q && T[q]) start = q;
  setLang(start);
  const h = location.hash.slice(1);
  if (h === "brand" || h === "creator" || h === "privacy") open(h);
})();
</script>
